    <path d="M439 430 C438 380 450 340 444 300 C466 330 462 382 439 430" fill="#adc4ad" stroke="#3b5a48" stroke-width="2"/>
    <path d="M400 430 h78 l-10 74 h-58 z" fill="#d9a07e" stroke="#3b5a48" stroke-width="2"/>
    <line x1="398" y1="430" x2="480" y2="430" stroke="#3b5a48" stroke-width="2"/>
